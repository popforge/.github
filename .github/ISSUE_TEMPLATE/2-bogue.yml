name: Bogue
description: Un comportement qui ne fait pas ce qu'il devrait
labels: ["bug"]
body:
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: obtenu
    attributes:
      label: Résultat obtenu
    validations:
      required: true
  - type: dropdown
    id: environnement
    attributes:
      label: Environnement
      options:
        - Production (popsalon.app)
        - Local
        - Autre
    validations:
      required: true
  - type: textarea
    id: journaux
    attributes:
      label: Journaux ou messages d'erreur
      render: shell
